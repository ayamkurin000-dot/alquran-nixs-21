<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9dfc7"><title>Doa & Bacaan | Nixs-21</title>
<style>
:root{color-scheme:light;--ink:#22372c;--muted:#687469;--line:#d9dacd;--gold:#a78345;--paper:#f9f7ee;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 system-ui,-apple-system,'Segoe UI',sans-serif}header{position:sticky;top:0;z-index:3;background:rgba(249,247,238,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.wrap{max-width:760px;margin:auto;padding:16px 18px}.top{display:flex;gap:12px;align-items:center}.back{border:1px solid var(--line);border-radius:12px;background:var(--white);font:inherit;color:inherit;padding:8px 13px;cursor:pointer}.top b{font-size:1.05rem}h1{font:700 clamp(1.6rem,5vw,2.2rem)/1.24 Georgia,serif;margin:19px 0 6px}p{margin:5px 0 18px}.muted{color:var(--muted)}.small{font-size:.86rem}.menu{display:grid;gap:10px;padding-bottom:32px}.item{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);border-radius:16px;background:var(--white);color:var(--ink);padding:15px 16px;cursor:pointer;font:inherit;box-shadow:0 3px 12px #28331f0a}.item:focus-visible,.back:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.item strong{display:block;line-height:1.4}.item small{display:block;color:var(--muted);margin-top:3px;line-height:1.4}.arrow{font-size:1.45rem;margin-left:8px;color:var(--gold)}.detail{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:22px 19px;margin-bottom:28px}.arab{font:normal clamp(1.7rem,6vw,2.35rem)/2.15 'Noto Naskh Arabic','Traditional Arabic',serif;direction:rtl;text-align:right;white-space:pre-line;overflow-wrap:anywhere}.latin{white-space:pre-line;color:#496153;font-style:italic}.translation{white-space:pre-line}.section{border-top:1px solid var(--line);margin-top:20px;padding-top:15px}.section b{display:block;margin-bottom:5px}.notice{border-left:3px solid var(--gold);padding:11px 13px;background:#f6f0e2;font-size:.88rem}.empty{padding:20px 0}button:hover{border-color:var(--gold)}[hidden]{display:none!important}@media(min-width:680px){.wrap{padding:20px 26px}}
</style></head><body><header><div class="wrap top"><button class="back" id="back" type="button">‹ Kembali</button><b id="navtitle">Doa & Bacaan</b></div></header><main class="wrap"><h1 id="heading">Doa & Bacaan</h1><p class="muted" id="intro">Pilih kategori untuk melihat daftar bacaan.</p><div id="content" aria-live="polite"></div></main>
<script>
(()=>{'use strict';
const categories=[['adab','Adab & Doa Harian','Aktivitas sehari-hari, perjalanan, sakit dan perlindungan'],['ibadah','Doa dalam & Setelah Sholat','Dzikir setelah sholat, sujud dan sebelum salam'],['wudhu','Wudhu, Tayamum & Niat Sholat','Bacaan wudhu, tayamum dan niat sholat'],['adzan','Adzan & Iqamah','Jawaban adzan, doa sesudah adzan dan iqamah'],['sunnah','Sholat Sunnah Khusus','Doa terkait sholat-sholat sunnah'],['istighfar','Istighfar & Munajat','Istighfar, taubat dan syair munajat'],['sholawat','Sholawat Nabi','Kumpulan ragam sholawat'],['nabi','Doa Para Nabi dalam Al-Qur’an','Doa dari kisah para nabi'],['tahlil','Tahlil, Yasin & Ziarah','Tahlil, tawassul Fatihah dan doa tahun baru'],['keluarga','Doa Keluarga & Anak Muslim','Orang tua, anak dan keturunan'],['keadaan','Doa dalam Berbagai Keadaan','Emosi, takjub, rezeki dan wasilah']];
const cache=new Map(),c=document.getElementById('content'),h=document.getElementById('heading'),i=document.getElementById('intro'),n=document.getElementById('navtitle'),back=document.getElementById('back');let seq=0;
function el(tag,cls,txt){const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x}
function state(){const p=new URLSearchParams(location.search);const cat=p.get('kategori'),id=p.get('id');return {cat:categories.some(v=>v[0]===cat)?cat:null,id:/^\d+$/.test(id||'')?Number(id):null}}
function go(cat,id){const p=new URLSearchParams();if(cat)p.set('kategori',cat);if(id)p.set('id',String(id));history.pushState({},'',location.pathname+(p.size?'?'+p:''));render()}
back.onclick=()=>{const s=state();if(s.id&&s.cat)go(s.cat);else if(s.cat)go(null);else location.href='../index.html'};addEventListener('popstate',render);
function title(x,desc){h.textContent=x;n.textContent=x;i.textContent=desc}
function menu(text,sub,onclick){const b=el('button','item');b.type='button';const span=el('span');span.append(el('strong','',text));if(sub)span.append(el('small','',sub));b.append(span,el('span','arrow','›'));b.onclick=onclick;return b}
async function load(cat){if(cache.has(cat))return cache.get(cat);const r=await fetch('./data/'+cat+'.json');if(!r.ok)throw Error('HTTP '+r.status);const a=await r.json();if(!Array.isArray(a))throw Error('Format data tidak dikenal');cache.set(cat,a);return a}
async function render(){const current=++seq,s=state(),meta=categories.find(v=>v[0]===s.cat);c.replaceChildren();window.scrollTo(0,0);
if(!meta){title('Doa & Bacaan','Pilih kategori untuk melihat daftar bacaan.');const m=el('div','menu');categories.forEach(v=>m.append(menu(v[1],v[2],()=>go(v[0]))));c.append(m,el('p','muted small','Koleksi ini masih memerlukan pemeriksaan editorial dan verifikasi rujukan satu per satu.'));return}
title(meta[1],meta[2]);c.append(el('p','muted','Memuat bacaan…'));
try{const items=await load(s.cat);if(current!==seq)return;c.replaceChildren();if(s.id){const x=items.find(v=>v.id===s.id);if(!x){c.append(el('p','empty','Bacaan tidak ditemukan.'));return}title(x.judul,meta[1]);const d=el('article','detail');if(x.muadzin)d.append(section('Lafaz muazin / konteks',x.muadzin));if(x.arab)d.append(el('div','arab',x.arab));if(x.latin)d.append(section('Latin',x.latin,'latin'));if(x.arti)d.append(section('Arti',x.arti,'translation'));if(x.kapan)d.append(section('Waktu / penggunaan menurut sumber',x.kapan));if(x.sumber)d.append(section('Rujukan yang tercantum dalam dataset (belum diverifikasi)',x.sumber));if(x.catatan)d.append(el('p','notice',x.catatan));d.append(el('p','muted small section','Keterangan dan atribusi bersumber dari database awal. Status kesahihan dan keutamaan belum diaudit secara independen.'));c.append(d);return}
const m=el('div','menu');items.forEach(v=>m.append(menu(v.judul,v.subkategori||v.kategori_asal,()=>go(s.cat,v.id))));c.append(el('p','muted small',items.length+' bacaan dalam kategori ini'),m)
}catch(e){if(current!==seq)return;c.replaceChildren();const p=el('p','notice','Data tidak dapat dimuat. Jalankan situs lewat server HTTP/hosting (bukan membuka file HTML langsung).');const b=el('button','back','Coba lagi');b.onclick=render;c.append(p,b)}}
function section(k,v,cls){const x=el('div','section');x.append(el('b','',k),el('div',cls||'',v));return x}render()})();
</script></body></html>
